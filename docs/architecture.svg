<svg width="760" viewBox="0 0 760 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ECB Macro and FX Risk Monitor architecture">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8b949e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: 'IBM Plex Sans','Segoe UI',sans-serif; }
      .title { fill:#e6edf3; font-size:14px; font-weight:600; }
      .sub   { fill:#8b949e; font-size:11px; font-family:'IBM Plex Mono',monospace; }
      .cap   { fill:#8b949e; font-size:11.5px; font-family:'IBM Plex Mono',monospace; letter-spacing:0.04em; }
      .hd    { fill:#e6edf3; font-size:16px; font-weight:700; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="220" rx="14" fill="#0d1117"/>
  <text class="hd" x="30" y="40">ECB Macro &amp; FX Risk Monitor</text>
  <text class="sub" x="30" y="58">end-to-end data pipeline &#183; euro-area FX risk</text>

  <g>
    <rect x="30"  y="90" width="120" height="58" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text class="title" x="90"  y="116" text-anchor="middle">ECB API</text>
    <text class="sub"   x="90"  y="134" text-anchor="middle">live ingestion</text>

    <rect x="186" y="90" width="120" height="58" rx="9" fill="#0d2538" stroke="#1f6feb" stroke-width="1"/>
    <text class="title" x="246" y="116" text-anchor="middle">PostgreSQL</text>
    <text class="sub"   x="246" y="134" text-anchor="middle">raw landing</text>

    <rect x="342" y="90" width="120" height="58" rx="9" fill="#0d2538" stroke="#1f6feb" stroke-width="1"/>
    <text class="title" x="402" y="116" text-anchor="middle">dbt</text>
    <text class="sub"   x="402" y="134" text-anchor="middle">staging &#8594; marts</text>

    <rect x="498" y="90" width="120" height="58" rx="9" fill="#0d2538" stroke="#1f6feb" stroke-width="1"/>
    <text class="title" x="558" y="116" text-anchor="middle">Risk metrics</text>
    <text class="sub"   x="558" y="134" text-anchor="middle">VaR &#183; vol &#183; GARCH</text>

    <rect x="654" y="90" width="106" height="58" rx="9" fill="#3a2a10" stroke="#e8a33d" stroke-width="1"/>
    <text class="title" x="707" y="116" text-anchor="middle">Streamlit</text>
    <text class="sub"   x="707" y="134" text-anchor="middle">dashboard</text>
  </g>

  <line x1="152" y1="119" x2="184" y2="119" stroke="#8b949e" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="308" y1="119" x2="340" y2="119" stroke="#8b949e" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="464" y1="119" x2="496" y2="119" stroke="#8b949e" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="620" y1="119" x2="652" y2="119" stroke="#8b949e" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="30" y="174" width="730" height="30" rx="8" fill="none" stroke="#21262d" stroke-width="1" stroke-dasharray="4 4"/>
  <text class="cap" x="395" y="193" text-anchor="middle">Single-command pipeline  &#183;  containerized with Docker  &#183;  versioned in Git  &#183;  tested with dbt + pytest</text>
</svg>
