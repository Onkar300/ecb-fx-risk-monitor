name: 'ecb_risk'
version: '1.0.0'
config-version: 2

profile: 'ecb_risk'        # must match the profile name in profiles.yml

model-paths:   ["models"]
seed-paths:    ["seeds"]
test-paths:    ["tests"]
macro-paths:   ["macros"]

target-path:   "target"
clean-targets: ["target", "dbt_packages"]

# Materializations: staging = views (cheap, always fresh),
# marts = tables (snapshotted; metrics live in marts).
models:
  ecb_risk:
    staging:
      +materialized: view
      +schema: staging          # writes to <db>.staging_staging by default; we override below
    marts:
      +materialized: table
      +schema: marts
